:root{
  --ink:#2b2b2b; --blue:#3fa3e0; --blue-d:#1f7fbf; --blue-l:#e3f3fd;
  --cream:#fffaf0; --green:#5bbf4f; --pink:#ff6fa8; --yellow:#ffd23f; --orange:#ff8a3d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe4fa;font-family:"Nunito",system-ui,sans-serif;color:var(--ink);touch-action:manipulation}
#stage{position:absolute;left:0;top:0;width:1440px;height:1000px;transform-origin:0 0;overflow:hidden;
  background:linear-gradient(#dff2fd,#f4fbff 60%,#fffaf0);border-radius:0}
button{font-family:"Fredoka",sans-serif;border:none;cursor:pointer;color:inherit;touch-action:manipulation}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:flex}
.wordmark{font-family:Georgia,serif;font-style:italic;color:var(--blue-d);font-size:26px;letter-spacing:.5px}
.wordmark b{font-style:normal;font-weight:700}
.wordmark small{display:block;font-family:"Nunito";font-style:normal;font-size:16px;color:#6a9bbd;letter-spacing:3px;text-align:center}

/* ---------- HOME ---------- */
#home{flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:radial-gradient(ellipse at 50% 120%,#a6e07f 0 32%,transparent 32.2%),linear-gradient(#cdeeff,#f1faff)}
#home h1{font-family:"Fredoka";font-weight:700;font-size:118px;margin:0;line-height:1;color:var(--blue-d);
  text-shadow:0 6px 0 #fff,0 10px 0 rgba(31,127,191,.25)}
#home h1 span{color:var(--green)}
#home .sub{font-family:"Fredoka";font-size:34px;color:#4b6b80;margin:0 0 14px}
#home .sub b{color:var(--orange)}
.big-btn{font-size:54px;font-weight:600;padding:22px 80px;border-radius:999px;background:var(--orange);color:#fff;
  box-shadow:0 10px 0 #d9662a,0 16px 30px rgba(0,0,0,.18);transition:transform .1s}
.big-btn:active{transform:translateY(6px);box-shadow:0 4px 0 #d9662a}
#homeBunny{width:230px;height:230px;animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
#home .wordmark{position:absolute;top:26px;left:34px}
.portrait-note{display:none}

/* ---------- MENU ---------- */
#menu{flex-direction:column;align-items:center;justify-content:center;gap:34px}
#menu h2{font-family:"Fredoka";font-size:64px;margin:0;color:var(--blue-d)}
.tiles{display:grid;grid-template-columns:repeat(4,300px);gap:28px}
.tile{background:#fff;border-radius:36px;padding:26px 18px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;
  box-shadow:0 10px 0 var(--tc),0 18px 30px rgba(0,0,0,.12);border:5px solid var(--tc);transition:transform .1s}
.tile:active{transform:translateY(6px);box-shadow:0 4px 0 var(--tc)}
.tile .num{font-family:"Fredoka";font-weight:700;color:#fff;background:var(--tc);border-radius:999px;width:54px;height:54px;font-size:32px;display:grid;place-items:center}
.tile svg{width:170px;height:130px}
.tile .tt{font-family:"Fredoka";font-weight:600;font-size:34px;line-height:1.05;text-align:center}
.tile .td{font-size:21px;color:#6b7c88;text-align:center;font-weight:700}
#menu .wordmark{position:absolute;bottom:26px}
.corner{position:absolute;top:26px;left:30px;width:84px;height:84px;border-radius:26px;background:#fff;
  box-shadow:0 6px 0 #b8d9ee;display:grid;place-items:center}
.corner svg{width:46px;height:46px}
.corner.r{left:auto;right:30px}

/* ---------- MEET ---------- */
#meet{flex-direction:column;align-items:center;justify-content:center;gap:30px}
#meet h2{font-family:"Fredoka";font-size:60px;margin:0;color:var(--blue-d)}
#meet .hint{font-size:28px;font-weight:800;color:#6b7c88;margin-top:-18px}
.wcards{display:grid;grid-template-columns:repeat(4,290px);gap:30px}
.wcard{background:#fff;border-radius:40px;height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border:6px solid var(--tc);box-shadow:0 12px 0 var(--tc)}
.wcard svg{width:230px;height:200px}
.wcard .w{font-family:"Fredoka";font-weight:600;font-size:66px;color:var(--ink)}
.wcard.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08) rotate(-2deg)}100%{transform:scale(1)}}
.meet-sentence{font-family:"Fredoka";font-size:58px;height:80px;color:var(--blue-d)}
.meet-sentence b{color:var(--orange)}
#meet .big-btn{font-size:40px;padding:16px 56px}

/* ---------- GAME ---------- */
#game{flex-direction:column}
.topbar{height:132px;flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:0 26px}
.tb-btn{width:84px;height:84px;border-radius:26px;background:#fff;box-shadow:0 6px 0 #b8d9ee;display:grid;place-items:center;flex:0 0 auto}
.tb-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8d9ee}
.tb-btn svg{width:46px;height:46px}
#mascot{width:118px;height:118px;flex:0 0 auto;margin-right:-6px}
#mascot.yay{animation:yay .6s}
#mascot.no{animation:no .5s}
@keyframes yay{0%,100%{transform:translateY(0)}35%{transform:translateY(-26px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}}
@keyframes no{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.bubble{flex:1;height:100px;background:#fff;border-radius:34px;border:5px solid var(--blue);position:relative;
  display:flex;align-items:center;gap:16px;padding:0 28px;font-family:"Fredoka";font-weight:600;font-size:50px;white-space:nowrap;overflow:hidden}
.bubble .txt{white-space:nowrap}
.bubble::before{content:"";position:absolute;left:-20px;top:36px;border:14px solid transparent;border-right:20px solid var(--blue)}
.bubble svg.bi{width:78px;height:64px;flex:0 0 auto}
.bubble .k{color:var(--orange)}
.bubble .kw{display:inline-block;transition:color .15s,transform .15s;margin-right:.24em}
.bubble .kw:last-child{margin-right:0}
.bubble .kw.lit{color:var(--orange);transform:translateY(-6px) scale(1.08)}
.bubble.good{border-color:var(--green)}
.bubble.good::before{border-right-color:var(--green)}
.prog:empty{display:none}
.prog{display:flex;gap:6px;align-items:center;background:#fff;border-radius:26px;padding:8px 14px;box-shadow:0 6px 0 #b8d9ee;flex:0 0 auto}
.prog .slots{display:grid;grid-template-columns:repeat(var(--cols,9),34px);gap:4px}
.prog .slots .slot{width:34px;height:34px;border-radius:10px}
.prog .slots .slot svg{width:30px;height:26px}
.slot{width:40px;height:40px;border-radius:14px;background:#eef3f6;display:grid;place-items:center;transition:background .3s}
.slot svg{width:34px;height:30px;opacity:.28;filter:grayscale(1);transition:all .3s}
.slot.done{background:#fff4c9}
.slot.done svg{opacity:1;filter:none;animation:pop .5s}
.prog .count{font-family:"Fredoka";font-weight:700;font-size:34px;margin-left:6px;color:var(--orange);min-width:66px;text-align:center}
.scene-wrap{flex:1;min-height:0;position:relative;padding:0 18px 16px;display:flex;justify-content:center}
#scene{height:100%;width:auto;max-width:100%;aspect-ratio:1440/860;margin:0 auto;display:block;background:#fff;border-radius:30px;border:6px solid var(--blue);box-shadow:0 8px 0 #a9d4ee}
#scene .obj{cursor:pointer}
#scene .part{transition:fill .5s ease}
#scene .hint{animation:glow 1s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,140,0,0))}50%{filter:drop-shadow(0 0 14px rgba(255,140,0,1)) drop-shadow(0 0 6px rgba(255,200,0,1))}}
#scene .wig{animation:wig .5s}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
#scene .obj{transform-box:fill-box;transform-origin:50% 60%}
.tray{flex:0 0 auto;height:178px;display:none;align-items:center;justify-content:center;gap:22px;padding-bottom:14px}
.tray.on{display:flex}
.acard{width:250px;height:150px;background:#fff;border-radius:30px;border:5px solid var(--tc);box-shadow:0 8px 0 var(--tc);
  display:flex;align-items:center;justify-content:center;gap:6px}
.acard svg{width:110px;height:96px}
.acard span{font-family:"Fredoka";font-weight:600;font-size:46px}
.acard:active{transform:translateY(4px);box-shadow:0 4px 0 var(--tc)}
.acard.right{background:#eaffdf;animation:pop .5s}
.acard.wrong{animation:no .45s;opacity:.55}
.acard.hint{animation:glowbox 1s infinite}
@keyframes glowbox{50%{box-shadow:0 8px 0 var(--tc),0 0 0 10px rgba(255,170,0,.55)}}
.crayon{width:104px;height:160px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;transition:transform .15s;padding:0}
.crayon .cb{width:70px;height:96px;border-radius:14px 14px 12px 12px;position:relative;background:var(--cc);box-shadow:inset 0 -12px 0 rgba(0,0,0,.13),0 5px 0 rgba(0,0,0,.15)}
.crayon .cb::before{content:"";position:absolute;left:50%;top:-26px;margin-left:-24px;border:24px solid transparent;border-bottom:28px solid var(--cc);border-top:0}
.crayon .cb::after{content:"";position:absolute;left:9px;right:9px;top:34px;height:12px;border-radius:6px;background:rgba(255,255,255,.45)}
.crayon .cl{font-family:"Fredoka";font-weight:600;font-size:23px;color:#4a5560}
.crayon.sel{transform:translateY(-16px)}
.crayon.sel .cl{color:var(--ink);text-decoration:underline;text-decoration-thickness:4px;text-decoration-color:var(--cc);text-underline-offset:4px}

.cpill{display:inline-block;padding:0 .3em;border-radius:.4em;transition:background .3s,color .3s}
.tray .sep{width:4px;height:100px;background:#d7e6ef;border-radius:2px}
.tray .tool{width:120px;height:120px;border-radius:30px;background:#fff;box-shadow:0 6px 0 #b8d9ee;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Fredoka";font-size:22px;font-weight:600}
.tray .tool svg{width:56px;height:56px}

/* ---------- RESULT ---------- */
#result{position:absolute;inset:0;background:rgba(20,60,100,.55);display:none;align-items:center;justify-content:center;z-index:20}
#result.on{display:flex}
.rcard{background:#fff;border-radius:50px;padding:36px 70px 44px;display:flex;flex-direction:column;align-items:center;gap:8px;
  border:8px solid var(--yellow);box-shadow:0 16px 0 #e5b320;animation:pop .6s}
.rcard h2{font-family:"Fredoka";font-size:76px;margin:0;color:var(--blue-d)}
.rcard p{font-size:32px;font-weight:800;margin:0;color:#5d6d78}
.stars{display:flex;gap:16px;margin:6px 0 14px}
.stars svg{width:110px;height:110px}
.stars svg.off{opacity:.2;filter:grayscale(1)}
.rbtns{display:flex;gap:24px;margin-top:12px}
.rbtns button{font-size:34px;font-weight:600;padding:16px 36px;border-radius:999px;color:#fff;background:var(--bc);box-shadow:0 8px 0 var(--bd)}
.rbtns button:active{transform:translateY(5px);box-shadow:0 3px 0 var(--bd)}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:30}
#rotate{position:fixed;inset:0;background:#3fa3e0;color:#fff;font-family:"Fredoka";font-size:34px;display:none;align-items:center;justify-content:center;text-align:center;z-index:99;padding:30px}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}

<script>
(function(){
"use strict";
/* ============ scaling ============ */
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1440,innerHeight/1000);stage.style.transform=`translate(${(innerWidth-1440*s)/2}px,${(innerHeight-1000*s)/2}px) scale(${s})`;}
addEventListener('resize',fit);fit();

/* ============ audio ============ */
let ctx=null,soundOn=true,voice=null;
function unlock(){
  try{ if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();} if(ctx.state==='suspended')ctx.resume();
    const b=ctx.createBuffer(1,1,22050),s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0);}catch(e){}
  try{ if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);} }catch(e){}
  pickVoice();
}
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices(); if(!vs.length)return;
  const en=vs.filter(v=>/^en[-_]/i.test(v.lang));
  voice=en.find(v=>/Samantha|Karen|Moira|Serena|Google US English|Aria|Jenny|Zira/i.test(v.name))||en.find(v=>/en[-_]US/i.test(v.lang))||en[0]||null;
}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=pickVoice;pickVoice();}
let lastSaid='';
function say(t,opts){
  lastSaid=t;
  if(!soundOn||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang=voice?voice.lang:'en-US';
    u.rate=(opts&&opts.rate)||0.85;u.pitch=1.12;speechSynthesis.speak(u);}catch(e){}
}
function tone(f,d,type,when,vol){
  if(!soundOn||!ctx)return;const t=ctx.currentTime+(when||0);
  const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.22,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+0.05);
}
const sfx={
  good(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',i*.08,.2));},
  bad(){tone(220,.18,'square',0,.07);tone(185,.25,'square',.12,.07);},
  pop(){tone(880,.08,'sine',0,.18);tone(1320,.1,'sine',.05,.12);},
  tap(){tone(660,.06,'triangle',0,.12);},
  fan(){[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',i*.13,.2));tone(1047,.7,'triangle',.8,.18);}
};
document.querySelectorAll('.sndBtn').forEach(b=>b.onclick=toggleSound);
function toggleSound(){soundOn=!soundOn;if(!soundOn&&'speechSynthesis' in window)speechSynthesis.cancel();
  document.querySelectorAll('.sndBtn use').forEach(u=>u.setAttribute('href',soundOn?'#ico-ear':'#ico-mute'));}

/* ============ helpers ============ */
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let timers=[];const later=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t);return t;};
const clearTimers=()=>{timers.forEach(clearTimeout);timers=[];};
const KINDS=['hill','tree','lake','flower'];
const FIND_KINDS=KINDS.concat(['cloud','sun','bird','duck','rabbit','bee','ladybug','turtle']);
const KCOL={hill:'#5dbb63',tree:'#4db34f',lake:'#3fa3e0',flower:'#ff6fa8'};
const NAMES={hill:'a hill',tree:'a tree',lake:'a lake',flower:'a flower',sun:'the sun',cloud:'a cloud',rabbit:'a rabbit',duck:'a duck',
  turtle:'a turtle',bee:'a bee',butterfly:'a butterfly',ladybug:'a ladybug',bird:'a bird',sky:'the sky',grass:'the grass'};

/* ============ scene builder ============ */
const NS='http://www.w3.org/2000/svg',INK='#2b2b2b';
const scene=$('scene');
function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function obj(kind){const g=mk('g',{class:'obj','data-kind':kind},world);return g;}
function part(g,tag,attrs,c,sw){return mk(tag,Object.assign({class:'part','data-c':c,fill:'#fff',stroke:INK,'stroke-width':sw||6,'stroke-linejoin':'round','stroke-linecap':'round'},attrs),g);}
function deco(g,tag,attrs,sw){return mk(tag,Object.assign({fill:'none',stroke:INK,'stroke-width':sw||5,'stroke-linecap':'round','stroke-linejoin':'round','pointer-events':'none'},attrs),g);}
function dot(g,x,y,r){return mk('circle',{cx:x,cy:y,r:r||4,fill:INK,'pointer-events':'none'},g);}
function hit(g,cx,cy,r){return mk('circle',{cx,cy,r,fill:'#000','fill-opacity':0,class:'hit'},g);}
function puff(cx,cy,rx,ry,n,b){
  let d='';const P=a=>[cx+rx*Math.cos(a),cy+ry*Math.sin(a)];
  for(let i=0;i<n;i++){const a0=i/n*Math.PI*2-Math.PI/2,a1=(i+1)/n*Math.PI*2-Math.PI/2,am=(a0+a1)/2;
    const p0=P(a0),p1=P(a1),c=[cx+rx*(1+b)*Math.cos(am),cy+ry*(1+b)*Math.sin(am)];
    if(!i)d+=`M${p0[0].toFixed(1)} ${p0[1].toFixed(1)}`;d+=` Q${c[0].toFixed(1)} ${c[1].toFixed(1)} ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`;}
  return d+'Z';
}
let world;
function buildScene(){
  scene.innerHTML='';
  const cp=mk('clipPath',{id:'clipW'},mk('defs',{},scene));mk('rect',{x:0,y:0,width:1440,height:860},cp);
  world=mk('g',{id:'world','clip-path':'url(#clipW)'},scene);
  // sky & grass (only colourable in Colour Time)
  const sky=mk('g',{class:'bg','data-kind':'sky'},world);
  part(sky,'rect',{x:0,y:0,width:1440,height:620,stroke:'none'},'#cdefff');
  // sun
  const sun=obj('sun');
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2,x1=985+Math.cos(a)*68,y1=118+Math.sin(a)*68,x2=985+Math.cos(a)*96,y2=118+Math.sin(a)*96;
    deco(sun,'path',{d:`M${x1} ${y1} L${x2} ${y2}`},7);}
  hit(sun,985,118,100);
  part(sun,'circle',{cx:985,cy:118,r:52},'#ffd23f');
  // clouds
  const c1=obj('cloud');part(c1,'path',{d:puff(560,112,110,52,9,.28)},'#cfe9ff');
  const c2=obj('cloud');part(c2,'path',{d:puff(160,96,82,40,8,.3)},'#cfe9ff');
  // hills (back right then front left)
  const h2=obj('hill');part(h2,'path',{d:'M520 640 C700 300 1020 300 1210 640Z'},'#5dbb63');
  [[760,420],[800,450],[850,415],[900,445],[950,420],[880,480],[1000,470]].forEach(p=>dot(h2,p[0],p[1],5));
  const h1=obj('hill');part(h1,'path',{d:'M-60 640 C110 230 470 210 720 640Z'},'#7dd35e');
  [[230,380],[280,350],[330,380],[260,420],[380,360],[310,440]].forEach(p=>dot(h1,p[0],p[1],5));
  // grass
  const gr=mk('g',{class:'bg','data-kind':'grass'},world);
  part(gr,'path',{d:'M-10 600 Q 360 560 720 592 T 1450 586 L1450 870 L-10 870Z'},'#b9e68f');
  [[60,640],[300,630],[560,860],[1120,620],[1400,650],[1000,850],[150,850]].forEach(p=>deco(gr,'path',{d:`M${p[0]-12} ${p[1]} l-6 -18 M${p[0]} ${p[1]} l0 -22 M${p[0]+12} ${p[1]} l6 -18`},4));
  // bunny on the hill
  bunnyAt(470,330);
  // trees
  tree(1260,650,150);
  tree(165,660,100);
  // bird in big tree
  const bd=obj('bird');hit(bd,1262,298,58);
  part(bd,'path',{d:'M1222 300 C1222 270 1262 262 1280 284 C1296 280 1306 292 1300 300 L1288 304 C1286 326 1236 334 1222 300Z'},'#ffb84d',5);
  part(bd,'path',{d:'M1300 296 L1318 300 L1300 306Z'},'#ff8a3d',4);
  part(bd,'path',{d:'M1236 300 C1246 286 1262 290 1264 304 C1254 314 1240 312 1236 300Z'},'#ff8a3d',4);
  dot(bd,1284,290,4);
  // lake
  const lk=obj('lake');
  part(lk,'path',{d:'M470 720 C470 650 600 625 730 628 C880 630 1000 650 1000 715 C1000 790 880 820 735 818 C590 816 470 790 470 720Z'},'#5eb8f2');
  [[560,690],[680,770],[830,680],[900,760],[620,740]].forEach(p=>deco(lk,'path',{d:`M${p[0]} ${p[1]} q10 -10 20 0 t20 0`},5));
  [[480,690],[995,690]].forEach((p,i)=>{const s=i?1:-1;deco(lk,'path',{d:`M${p[0]} ${p[1]} l${8*s} -50 M${p[0]+10*s} ${p[1]+6} l${22*s} -46 M${p[0]-6*s} ${p[1]+10} l${-8*s} -44`},5);
     mk('ellipse',{cx:p[0]+8*s,cy:p[1]-56,rx:6,ry:14,fill:INK,'pointer-events':'none',transform:`rotate(${8*s} ${p[0]+8*s} ${p[1]-56})`},lk);});
  // duck & turtle
  duck(800,690);
  turtle(620,700);
  // flowers
  flower(360,690,'#ff6fa8','#ffd23f');
  flower(1090,690,'#ffd23f','#ff8a3d');
  flower(1380,720,'#b57bff','#ffd23f');
  flower(60,740,'#ff8a3d','#fff3a0');
  // bugs
  bee(960,540); butterfly(720,560); ladybug(250,810);
  // fx layer & spotlight
  mk('g',{id:'fx','pointer-events':'none'},scene);
  mk('path',{id:'spot',d:'',fill:'#16304a','fill-opacity':.62,'fill-rule':'evenodd','pointer-events':'none'},scene);
  mk('circle',{id:'spotRing',r:0,cx:-200,cy:-200,fill:'none',stroke:'#ffd23f','stroke-width':10,'stroke-dasharray':'26 18','pointer-events':'none'},scene);
}
function tree(x,base,r){
  const g=obj('tree');const cy=base-r*1.75;
  part(g,'path',{d:`M${x-r*.2} ${base} C${x-r*.14} ${base-r*.6} ${x-r*.12} ${cy+r*.5} ${x-r*.14} ${cy+r*.4} L${x+r*.14} ${cy+r*.4} C${x+r*.12} ${cy+r*.5} ${x+r*.14} ${base-r*.6} ${x+r*.2} ${base}Z`},'#a86b3c');
  deco(g,'path',{d:`M${x-r*.2} ${base} l-14 6 M${x+r*.2} ${base} l14 6`},5);
  part(g,'path',{d:puff(x,cy,r*.95,r*.8,10,.2)},'#4db34f');
  deco(g,'path',{d:`M${x-r*.5} ${cy-r*.1} q12 -12 24 0 M${x+r*.25} ${cy+r*.25} q12 -12 24 0 M${x-r*.15} ${cy-r*.5} q12 -12 24 0`},5);
}
function flower(x,y,pc,cc){
  const g=obj('flower');
  hit(g,x,y+20,82);
  deco(g,'path',{d:`M${x} ${y+30} V${y+110}`},6);
  part(g,'path',{d:`M${x} ${y+88} C${x-26} ${y+64} ${x-48} ${y+74} ${x-54} ${y+94} C${x-30} ${y+102} ${x-12} ${y+100} ${x} ${y+88}Z`},'#5bbf4f',5);
  part(g,'path',{d:`M${x} ${y+76} C${x+24} ${y+52} ${x+46} ${y+60} ${x+52} ${y+80} C${x+30} ${y+88} ${x+12} ${y+88} ${x} ${y+76}Z`},'#5bbf4f',5);
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2;part(g,'circle',{cx:x+Math.cos(a)*30,cy:y+Math.sin(a)*30,r:22},pc,5);}
  part(g,'circle',{cx:x,cy:y,r:19},cc,5);
}
function bunnyAt(x,y){
  const g=obj('rabbit');hit(g,x,y+10,62);
  part(g,'ellipse',{cx:x-14,cy:y-44,rx:11,ry:30,transform:`rotate(-12 ${x-14} ${y-44})`},'#f0e1d0',5);
  part(g,'ellipse',{cx:x+16,cy:y-44,rx:11,ry:30,transform:`rotate(14 ${x+16} ${y-44})`},'#f0e1d0',5);
  part(g,'ellipse',{cx:x+4,cy:y+44,rx:38,ry:26},'#f0e1d0',5);
  part(g,'circle',{cx:x,cy:y+2,r:34},'#f0e1d0',5);
  dot(g,x-12,y-2,5);dot(g,x+12,y-2,5);
  deco(g,'path',{d:`M${x-6} ${y+14} q6 6 12 0`},4);
}
function duck(x,y){
  const g=obj('duck');hit(g,x,y,70);
  part(g,'path',{d:`M${x-70} ${y+6} C${x-70} ${y+50} ${x+50} ${y+56} ${x+56} ${y+10} C${x+30} ${y+20} ${x+10} ${y+6} ${x+16} ${y-12} C${x-10} ${y-14} ${x-40} ${y-10} ${x-70} ${y+6}Z`},'#ffe45c',5);
  part(g,'circle',{cx:x+30,cy:y-30,r:26},'#ffe45c',5);
  part(g,'path',{d:`M${x+52} ${y-36} L${x+82} ${y-28} L${x+52} ${y-20}Z`},'#ff9f1c',5);
  dot(g,x+36,y-36,5);
  deco(g,'path',{d:`M${x-30} ${y+14} q20 16 40 0`},5);
}
function turtle(x,y){
  const g=obj('turtle');hit(g,x,y,62);
  part(g,'circle',{cx:x+56,cy:y+6,r:16},'#a5d86e',5);
  part(g,'ellipse',{cx:x-30,cy:y+24,rx:12,ry:9},'#a5d86e',5);part(g,'ellipse',{cx:x+30,cy:y+24,rx:12,ry:9},'#a5d86e',5);
  part(g,'path',{d:`M${x-50} ${y+18} C${x-50} ${y-40} ${x+46} ${y-40} ${x+46} ${y+18}Z`},'#4caf50',5);
  deco(g,'path',{d:`M${x-16} ${y-18} L${x+10} ${y-18} L${x+18} ${y} L${x+6} ${y+18} M${x-16} ${y-18} L${x-26} ${y} L${x-16} ${y+18} M${x-26} ${y} H${x-48} M${x+18} ${y} H${x+44}`},4);
  dot(g,x+62,y+2,3.5);
}
function bee(x,y){
  const g=obj('bee');hit(g,x,y,56);
  part(g,'ellipse',{cx:x-6,cy:y-26,rx:14,ry:20,transform:`rotate(-25 ${x-6} ${y-26})`},'#e8f7ff',4);
  part(g,'ellipse',{cx:x+12,cy:y-26,rx:14,ry:20,transform:`rotate(25 ${x+12} ${y-26})`},'#e8f7ff',4);
  part(g,'ellipse',{cx:x,cy:y,rx:30,ry:20},'#ffd23f',5);
  deco(g,'path',{d:`M${x-8} ${y-18} V${y+18} M${x+8} ${y-18} V${y+18}`},6);
  dot(g,x+20,y-4,4);
  deco(g,'path',{d:`M${x-60} ${y+26} q10 -14 20 0 t20 0`,'stroke-dasharray':'6 8'},4);
}
function butterfly(x,y){
  const g=obj('butterfly');hit(g,x,y,58);
  part(g,'ellipse',{cx:x-22,cy:y-14,rx:22,ry:18},'#ff8ad0',5);part(g,'ellipse',{cx:x+22,cy:y-14,rx:22,ry:18},'#ff8ad0',5);
  part(g,'ellipse',{cx:x-16,cy:y+16,rx:15,ry:13},'#9b7bff',5);part(g,'ellipse',{cx:x+16,cy:y+16,rx:15,ry:13},'#9b7bff',5);
  part(g,'ellipse',{cx:x,cy:y,rx:6,ry:24},'#6b4f3a',4);
  deco(g,'path',{d:`M${x-2} ${y-22} q-8 -16 -16 -18 M${x+2} ${y-22} q8 -16 16 -18`},4);
}
function ladybug(x,y){
  const g=obj('ladybug');hit(g,x,y,50);
  part(g,'circle',{cx:x+30,cy:y,r:14},'#2b2b2b',5);
  part(g,'circle',{cx:x,cy:y,r:30},'#ff4b4b',5);
  deco(g,'path',{d:`M${x+28} ${y-6} L${x-28} ${y-4}`},4);
  [[-12,-14],[10,-14],[-14,10],[8,12]].forEach(p=>dot(g,x+p[0],y+p[1],5));
}
function objs(kind){return [...world.querySelectorAll('.obj')].filter(o=>!kind||o.dataset.kind===kind);}
function targets(){return [...world.querySelectorAll('.obj')].filter(o=>FIND_KINDS.includes(o.dataset.kind));}
function colourIn(g){g.querySelectorAll('.part').forEach(p=>p.setAttribute('fill',p.dataset.c));g.dataset.done='1';}
function colourAll(){world.querySelectorAll('.part').forEach(p=>p.setAttribute('fill',p.dataset.c));}
function blankAll(){world.querySelectorAll('.part').forEach(p=>p.setAttribute('fill','#fff'));world.querySelectorAll('.obj').forEach(o=>delete o.dataset.done);}
function centerOf(g){const b=g.getBBox();return {x:b.x+b.width/2,y:b.y+b.height/2,r:Math.max(b.width,b.height)/2};}
function sparkle(g){
  const fx=$('fx'),c=centerOf(g);
  for(let i=0;i<10;i++){const a=i/10*Math.PI*2,s=mk('use',{href:'#ico-star',x:-18,y:-18,width:36,height:36},fx);
    s.style.transition='transform .7s ease-out, opacity .7s';s.setAttribute('transform',`translate(${c.x} ${c.y})`);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.transform=`translate(${c.x+Math.cos(a)*(c.r+50)}px,${c.y+Math.sin(a)*(c.r+50)}px)`;s.style.opacity=0;}));
    setTimeout(()=>s.remove(),800);}
}
function wiggle(g){g.classList.remove('wig');void g.getBBox();g.classList.add('wig');setTimeout(()=>g.classList.remove('wig'),550);}
function mascot(cls){const m=$('mascot');m.classList.remove('yay','no');void m.offsetWidth;m.classList.add(cls);}

/* ============ bubble ============ */
const bubble=$('bubble');
function bubblePrompt(kind,text){bubble.className='bubble';bubble.innerHTML=(kind?`<svg class="bi" viewBox="0 0 120 100"><use href="#ico-${kind}"/></svg>`:'')+`<span class="txt">${text}</span>`;}
function bubbleSentence(kind,lead,adj){
  bubble.className='bubble good';
  const words=adj?['I','see','a',adj.name,kind]:['I','see'].concat(NAMES[kind].split(' '));words[words.length-1]+='.';
  bubble.innerHTML=`<span class="txt">`+(lead?`<span style="color:#5bbf4f;margin-right:.3em">${lead}</span>`:'')+words.map((w,i)=>adj&&i===3?`<span class="kw" style="color:${adj.ink}">${w}</span>`:`<span class="kw">${w}</span>`).join('')+`</span>`+(lead?'':`<svg class="bi" viewBox="0 0 120 100"><use href="#ico-${kind}"/></svg>`);
  const spans=bubble.querySelectorAll('.kw');[0,330,620,880,1150].slice(0,spans.length).forEach((t,i)=>later(()=>{spans.forEach(s=>s.classList.remove('lit'));spans[i].classList.add('lit');},t+250));
  later(()=>spans.forEach(s=>s.classList.remove('lit')),1900);
}

/* ============ navigation ============ */
let mode=null;
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));$('result').classList.remove('on');}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{sfx.tap();stopGame();show(b.dataset.go);}));
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{sfx.tap();start(b.dataset.mode);}));
$('startBtn').onclick=()=>{unlock();sfx.good();show('menu');later(()=>say('What shall we play?'),300);};
$('replayBtn').onclick=()=>{sfx.tap();if(lastSaid)say(lastSaid);};

function stopGame(){clearTimers();mode=null;stopConfetti();if('speechSynthesis' in window)speechSynthesis.cancel();}

/* ---------- Meet ---------- */
document.querySelectorAll('.wcard').forEach(c=>c.addEventListener('click',()=>{
  const w=c.dataset.w;sfx.pop();c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');
  $('meetSent').innerHTML=`I see a <b>${w}</b>.`;say(`${w}. ... I see a ${w}.`,{rate:.8});
}));

function start(m){
  stopGame();mode=m;
  if(m==='meet'){show('meet');$('meetSent').innerHTML='&nbsp;';later(()=>say('Tap a picture. Listen and say!'),200);return;}
  show('game');buildScene();
  const tray=$('tray');tray.innerHTML='';tray.classList.remove('on');
  $('spot').setAttribute('d','');$('spotRing').setAttribute('r',0);
  if(m==='find')startFind();
  if(m==='see')startSee();
  if(m==='colour')startColour();
  if(m==='free')startFree();
}

/* ---------- Find & Colour ---------- */
let F={};
function buildProg(list){
  const p0=$('prog');p0.innerHTML='';let p=p0;
  if(list.length>7){p=document.createElement('div');p.className='slots';p.style.setProperty('--cols',list.length>10?9:Math.ceil(list.length/2));p0.appendChild(p);}
  list.forEach(k=>{const s=document.createElement('div');s.className='slot';s.dataset.k=k;s.innerHTML=`<svg viewBox="0 0 120 100"><use href="#ico-${k}"/></svg>`;p.appendChild(s);});
}
function fillSlot(k){const s=[...$('prog').querySelectorAll('.slot')].find(s=>s.dataset.k===k&&!s.classList.contains('done'));if(s)s.classList.add('done');}
function setCount(n,t){let c=$('prog').querySelector('.count');if(!c){c=document.createElement('span');c.className='count';$('prog').appendChild(c);}c.textContent=`${n}/${t}`;}
function startFind(){
  blankAll();
  const ts=targets();
  F={total:ts.length,found:0,wrong:0,kind:null,last:null,lock:false,miss:0};
  buildProg(FIND_KINDS.flatMap(k=>objs(k).map(()=>k)));
  bubblePrompt(null,'Find and colour!');say('Find and colour!');
  later(nextFind,1500);
}
function remaining(){return targets().filter(o=>!o.dataset.done);}
function nextFind(){
  const rem=remaining();
  if(!rem.length){return finish('find');}
  let ks=[...new Set(rem.map(o=>o.dataset.kind))];
  const pool=ks.length>1?ks.filter(k=>k!==F.last):ks;
  F.kind=rnd(pool);F.last=F.kind;F.miss=0;F.lock=false;
  bubblePrompt(F.kind,`Find <span class="k">${NAMES[F.kind]}</span>!`);
  say(`Find ${NAMES[F.kind]}.`);
  armHint(7000);
}
let hintT=null;
function armHint(ms){clearTimeout(hintT);hintT=later(showHint,ms);}
function showHint(){clearHint();if(mode==='find')remaining().filter(o=>o.dataset.kind===F.kind).forEach(o=>o.classList.add('hint'));}
function clearHint(){world&&world.querySelectorAll('.hint').forEach(o=>o.classList.remove('hint'));}
function onFindTap(g){
  if(F.lock)return;
  const k=g.dataset.kind;
  if(k===F.kind&&!g.dataset.done){
    F.lock=true;clearHint();clearTimeout(hintT);
    colourIn(g);sparkle(g);sfx.good();mascot('yay');F.found++;fillSlot(k);setCount(F.found,F.total);
    bubbleSentence(k,'Yes!');say(`Yes! I see ${NAMES[k]}.`);
    later(nextFind,2600);
  }else if(k===F.kind){
    sfx.tap();wiggle(g);say(`You coloured that one. Find another ${k}!`);
  }else{
    F.wrong++;F.miss++;sfx.bad();mascot('no');wiggle(g);
    say(`That's ${NAMES[k]}. Find ${NAMES[F.kind]}.`);
    if(F.miss>=2)showHint();else armHint(6000);
  }
}

/* ---------- What do you see? ---------- */
let S={};
function startSee(){
  colourAll();
  const tray=$('tray');tray.classList.add('on');
  KINDS.forEach(k=>{const b=document.createElement('button');b.className='acard';b.style.setProperty('--tc',KCOL[k]);b.dataset.k=k;
    b.innerHTML=`<svg viewBox="0 0 120 100"><use href="#ico-${k}"/></svg><span>${k}</span>`;b.onclick=()=>onSeeTap(b);tray.appendChild(b);});
  const order=shuffle(KINDS.concat(KINDS));
  const used=new Set();
  S={rounds:order.map(k=>{const c=objs(k);let o=c.find(x=>!used.has(x))||rnd(c);used.add(o);return o;}),i:-1,wrong:0,miss:0,lock:true};
  buildProg(order.map(()=>'star'));
  $('prog').querySelectorAll('.slot').forEach(s=>s.innerHTML='<svg viewBox="0 0 100 100"><use href="#ico-star"/></svg>');
  bubblePrompt(null,'Look! What do you see?');
  later(nextSee,400);
}
function spotOn(g){
  const c=centerOf(g),r=Math.min(Math.max(c.r+26,90),330);
  $('spot').setAttribute('d',`M0 0H1440V860H0Z M${c.x-r} ${c.y} a${r} ${r} 0 1 0 ${2*r} 0 a${r} ${r} 0 1 0 ${-2*r} 0Z`);
  const ring=$('spotRing');ring.setAttribute('cx',c.x);ring.setAttribute('cy',c.y);ring.setAttribute('r',r);
}
function nextSee(){
  S.i++;
  if(S.i>=S.rounds.length)return finish('see');
  const g=S.rounds[S.i];S.target=g.dataset.kind;S.miss=0;S.lock=false;
  document.querySelectorAll('.acard').forEach(b=>b.classList.remove('right','wrong','hint'));
  spotOn(g);wiggle(g);
  bubblePrompt(null,'What do you see?');say('What do you see?');
}
function onSeeTap(b){
  if(S.lock)return;const k=b.dataset.k;
  if(k===S.target){
    S.lock=true;b.classList.add('right');sfx.good();mascot('yay');sparkle(S.rounds[S.i]);
    const sl=$('prog').querySelectorAll('.slot')[S.i];if(sl)sl.classList.add('done');setCount(S.i+1,S.rounds.length);
    bubbleSentence(k);say(`I see ${NAMES[k]}.`);
    later(nextSee,2700);
  }else{
    S.wrong++;S.miss++;sfx.bad();mascot('no');b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');
    say(`Not ${NAMES[k]}. Look again!`);
    if(S.miss>=2)document.querySelector(`.acard[data-k="${S.target}"]`).classList.add('hint');
  }
}

/* ---------- Listen & Colour ---------- */
const COLS=[{name:'red',hex:'#ff4b4b',ink:'#e53935'},{name:'orange',hex:'#ff8a3d',ink:'#f07020'},{name:'yellow',hex:'#ffd23f',ink:'#e0a800'},
  {name:'green',hex:'#5bbf4f',ink:'#3e9a35'},{name:'blue',hex:'#3fa3e0',ink:'#1f7fbf'},{name:'purple',hex:'#9b6bff',ink:'#7a4be0'},
  {name:'pink',hex:'#ff6fa8',ink:'#e0457f'},{name:'brown',hex:'#a86b3c',ink:'#8a5226'}];
const colBy=n=>COLS.find(c=>c.name===n);
const TASKS={sun:['yellow','orange'],cloud:['blue'],hill:['green'],tree:['green'],lake:['blue'],flower:['pink','red','purple','orange','yellow'],
  duck:['yellow'],rabbit:['brown','pink'],bee:['yellow'],ladybug:['red'],turtle:['green'],bird:['red','blue','orange']};
const MAINC={tree:'#4db34f',duck:'#ffe45c',rabbit:'#f0e1d0',bee:'#ffd23f',ladybug:'#ff4b4b',turtle:'#4caf50',bird:'#ffb84d',sun:'#ffd23f'};
function mainParts(g){const k=g.dataset.kind,ps=[...g.querySelectorAll('.part')];
  if(['hill','cloud','lake'].includes(k))return ps;
  if(k==='flower')return ps.filter(p=>p.getAttribute('r')==='22');
  return ps.filter(p=>p.dataset.c===MAINC[k]);}
function crayonTray(onPick){
  const tray=$('tray');tray.innerHTML='';tray.classList.add('on');
  COLS.forEach(c=>{const b=document.createElement('button');b.className='crayon';b.style.setProperty('--cc',c.hex);b.dataset.col=c.name;
    b.innerHTML=`<span class="cb"></span><span class="cl">${c.name}</span>`;
    b.onclick=()=>{sfx.tap();tray.querySelectorAll('.crayon').forEach(x=>x.classList.toggle('sel',x===b));onPick(c,b);};tray.appendChild(b);});
  return tray;
}
let C={};
function startColour(){
  blankAll();
  const objsAll=objs().filter(o=>TASKS[o.dataset.kind]);
  const must=KINDS.map(k=>rnd(objs(k)));
  const rest=shuffle(objsAll.filter(o=>!must.includes(o)));
  const used=new Set(must.map(o=>o.dataset.kind==='flower'||o.dataset.kind==='hill'?'x':o.dataset.kind));
  const extra=[];for(const o of rest){if(extra.length>=6)break;const k=o.dataset.kind;if(['tree','hill','lake'].includes(k))continue;
    if(k!=='flower'&&k!=='cloud'&&used.has(k))continue;if(extra.filter(x=>x.dataset.kind===k).length)continue;extra.push(o);used.add(k);}
  let rounds=shuffle(must.concat(extra));
  C={rounds:rounds.map(o=>({kind:o.dataset.kind,col:colBy(rnd(TASKS[o.dataset.kind]))})),i:-1,wrong:0,miss:0,pick:null,lock:true};
  buildProg(C.rounds.map(()=>'star'));
  $('prog').querySelectorAll('.slot').forEach(s=>s.innerHTML='<svg viewBox="0 0 100 100"><use href="#ico-star"/></svg>');
  crayonTray((c,b)=>{if(mode!=='colour')return;C.pick=c;say(c.name);});
  bubblePrompt(null,'Listen and colour!');say('Listen and colour!');
  later(nextColour,1500);
}
function colourPrompt(showCol){
  const r=C.rounds[C.i];
  bubblePrompt(r.kind,`Colour the <span class="k">${r.kind}</span> <span class="cpill" id="cpill" style="${showCol?`background:${r.col.hex};color:${r.col.name==='yellow'?'#2b2b2b':'#fff'}`:''}">${r.col.name}</span>!`);
}
function nextColour(){
  C.i++;clearHint();document.querySelectorAll('.crayon').forEach(x=>x.classList.remove('sel','hint'));C.pick=null;
  if(C.i>=C.rounds.length)return finish('colour');
  const r=C.rounds[C.i];C.miss=0;C.lock=false;
  colourPrompt(false);say(`Colour the ${r.kind} ${r.col.name}.`);
}
function colourHint(){
  const r=C.rounds[C.i];colourPrompt(true);
  objs(r.kind).filter(o=>!o.dataset.done).forEach(o=>o.classList.add('hint'));
  const cb=document.querySelector(`.crayon[data-col="${r.col.name}"]`);if(cb)cb.classList.add('hint');
}
function onListenTap(g){
  if(C.lock||!g)return;const r=C.rounds[C.i],k=g.dataset.kind;
  const again=` Colour the ${r.kind} ${r.col.name}.`;
  if(!C.pick){sfx.bad();mascot('no');say('Pick a crayon first!'+again);const cb=document.querySelector(`.crayon[data-col="${r.col.name}"]`);
    document.querySelectorAll('.crayon').forEach(x=>{x.classList.remove('wrong');void x.offsetWidth;x.classList.add('wrong');});return;}
  const rightObj=k===r.kind&&!g.dataset.done, rightCol=C.pick.name===r.col.name;
  if(rightObj&&rightCol){
    C.lock=true;clearHint();
    g.querySelectorAll('.part').forEach(p=>p.setAttribute('fill',p.dataset.c));
    mainParts(g).forEach(p=>p.setAttribute('fill',r.col.hex));g.dataset.done='1';
    sparkle(g);sfx.good();mascot('yay');
    const sl=$('prog').querySelectorAll('.slot')[C.i];if(sl)sl.classList.add('done');setCount(C.i+1,C.rounds.length);
    bubbleSentence(r.kind,null,r.col);say(`Yes! I see a ${r.col.name} ${r.kind}.`);
    later(nextColour,2900);return;
  }
  C.wrong++;C.miss++;sfx.bad();mascot('no');wiggle(g);
  if(k===r.kind&&g.dataset.done)say(`You coloured that one.`+again);
  else if(rightObj)say(`Oops, that's ${C.pick.name}.`+again);
  else say(`That's the ${k}.`+again);
  if(C.miss>=2)colourHint();
}

/* ---------- Free colouring (bonus after Find & Colour) ---------- */
let FR={};
function startFree(keep){
  if(!keep)blankAll();
  FR={col:COLS[3],said:0};$('prog').innerHTML='';
  const tray=crayonTray(c=>{FR.col=c;say(c.name);});
  tray.querySelector('.crayon[data-col="green"]').classList.add('sel');
  const sep=document.createElement('div');sep.className='sep';tray.appendChild(sep);
  const magic=document.createElement('button');magic.className='tool';magic.innerHTML='<svg viewBox="0 0 100 100"><use href="#ico-star"/></svg>Magic';
  magic.onclick=()=>{sfx.fan();colourAll();say('Wow! What a beautiful picture!');};tray.appendChild(magic);
  bubblePrompt(null,'Pick a colour. Tap the picture!');say('Pick a colour. Tap the picture!');
}
function onFreeTap(e){
  const p=e.target.closest('.part');if(!p)return;
  p.setAttribute('fill',FR.col.hex);sfx.pop();
  const g=p.closest('[data-kind]');const k=g&&g.dataset.kind;
  if(k&&NAMES[k]&&Date.now()-FR.said>1800){FR.said=Date.now();
    if(FIND_KINDS.includes(k)){bubbleSentence(k);say(`I see ${NAMES[k]}.`);}else{bubblePrompt(null,`I see <span class="k">${NAMES[k]}</span>.`);say(`I see ${NAMES[k]}.`);}}
}

/* ---------- scene taps ---------- */
scene.addEventListener('click',e=>{
  if(mode==='free')return onFreeTap(e);
  const g=e.target.closest('.obj');
  if(mode==='colour')return onListenTap(g);
  if(mode==='find'&&g)onFindTap(g);
});

/* ---------- results ---------- */
function finish(m){
  clearTimers();sfx.fan();startConfetti();
  const wrong=m==='find'?F.wrong:m==='see'?S.wrong:C.wrong;
  const stars=wrong<=1?3:wrong<=4?2:1;
  $('rTitle').textContent=stars===3?'Super star!':stars===2?'Great job!':'Good try!';
  $('rText').textContent=m==='find'?'You found and coloured it all!':m==='see'?'You can say "I see a…"!':'Great listening and colouring!';
  $('rStars').innerHTML=[1,2,3].map(i=>`<svg class="${i<=stars?'':'off'}" viewBox="0 0 100 100"><use href="#ico-star"/></svg>`).join('');
  const btns=$('rBtns');btns.innerHTML='';
  const add=(t,bc,bd,fn)=>{const b=document.createElement('button');b.textContent=t;b.style.setProperty('--bc',bc);b.style.setProperty('--bd',bd);b.onclick=()=>{sfx.tap();fn();};btns.appendChild(b);};
  add('↻ Again','#5bbf4f','#3e9a35',()=>start(m));
  if(m==='find')add('🖍 Colour more','#ff6fa8','#d64d86',()=>{stopConfetti();$('result').classList.remove('on');mode='free';startFree(true);});
  if(m==='colour')add('🖍 Free colouring','#ff6fa8','#d64d86',()=>{stopConfetti();$('result').classList.remove('on');mode='free';startFree(true);});
  if(m==='find')add('Next: What do you see?','#ff8a3d','#d9662a',()=>start('see'));
  add('Menu','#3fa3e0','#1f7fbf',()=>{stopGame();show('menu');});
  later(()=>{$('result').classList.add('on');say(stars===3?'Super star! Great job!':'Great job!');},900);
}

/* ---------- confetti ---------- */
const cv=$('confetti'),cx2=cv.getContext('2d');let conf=[],confRaf=null;
function startConfetti(){conf=Array.from({length:150},()=>({x:Math.random()*1440,y:-Math.random()*600,vx:(Math.random()-.5)*3,vy:3+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.25,
  c:rnd(['#ff6fa8','#ffd23f','#5bbf4f','#3fa3e0','#ff8a3d','#b57bff']),w:12+Math.random()*10,h:8+Math.random()*8}));
  cancelAnimationFrame(confRaf);const t0=performance.now();
  (function loop(t){cx2.clearRect(0,0,1440,1000);conf.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx2.save();cx2.translate(p.x,p.y);cx2.rotate(p.r);cx2.fillStyle=p.c;cx2.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx2.restore();});
    if(t-t0<5000)confRaf=requestAnimationFrame(loop);else cx2.clearRect(0,0,1440,1000);})(t0);}
function stopConfetti(){cancelAnimationFrame(confRaf);cx2.clearRect(0,0,1440,1000);}

window.__game={start,show,finish,F:()=>F,S:()=>S,C:()=>C,targets,objs};
})();
</script>
